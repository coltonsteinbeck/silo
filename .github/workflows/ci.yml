name: CI

permissions:
  contents: read

env:
  BUN_VERSION: '1.4.5'

on:
  push:
    branches: ['main', 'release/**']
  pull_request:
    branches: ['main', 'release/**']

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Scan tracked files and dependencies
        run: |
          set -euo pipefail
          scan_dir=$(mktemp -d)
          trap 'rm -rf "$scan_dir"' EXIT
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$scan_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scan_dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
          mkdir "$scan_dir/source"
          git archive HEAD | tar -x -C "$scan_dir/source"
          if ! "$scan_dir/gitleaks" dir --no-banner --redact=100 "$scan_dir/source" >/dev/null 2>&1; then
            echo "Secret scan found a match or failed. Investigate with redacted local output."
            exit 1
          fi
          for mode in production full; do
            if [ "$mode" = production ]; then
              set -- --production
            else
              set --
            fi
            if ! bun --no-env-file audit --json "$@" > "$scan_dir/audit.json" ||
                ! jq -e 'type == "object" and length == 0' "$scan_dir/audit.json" >/dev/null; then
              echo "Dependency audit found findings or could not complete."
              exit 1
            fi
          done

  safety-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bash scripts/install-locked.sh
        env:
          YOUTUBE_DL_HOST: https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp

      - name: Safety Regression Gate
        run: bun test packages/bot/src/__tests__/security/safety-regression.integration.test.ts

  build:
    runs-on: ubuntu-latest
    needs: [safety-regression]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bash scripts/install-locked.sh
        env:
          YOUTUBE_DL_HOST: https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp

      - name: Verify native voice module
        run: cd packages/bot && bun --eval "require('@discordjs/opus')"

      - name: Verify radio runtime
        run: bun run radio:verify-runtime

      - name: Repo Hygiene
        run: bun run hygiene:check

      - name: Diff Whitespace
        run: git diff --check

      - name: Build
        run: bun run build

      - name: Type-check
        run: bun run type-check

      - name: Lint
        run: bun lint

      - name: Format
        run: bun run format:check

      - name: Test
        run: bun test

      - name: Validate radio encoder
        run: bun run radio:validate --offline

  release-gate:
    if: ${{ always() }}
    needs: [safety-regression, build, security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful verification jobs
        env:
          SAFETY_RESULT: ${{ needs.safety-regression.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          for result in "$SAFETY_RESULT" "$BUILD_RESULT" "$SECURITY_RESULT"; do
            if [ "$result" != success ]; then
              echo "Every verification job must run and pass."
              exit 1
            fi
          done
