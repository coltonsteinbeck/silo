name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  safety-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Safety Regression Gate
        run: bun test packages/bot/src/__tests__/security/safety-regression.integration.test.ts

  build:
    runs-on: ubuntu-latest
    needs: [safety-regression]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Repo Hygiene
        run: bun run hygiene:check

      - name: Diff Whitespace
        run: git diff --check

      - name: Build
        run: bun run build

      - name: Type-check
        run: bun run type-check

      - name: Lint
        run: bun lint

      - name: Test
        run: bun test
