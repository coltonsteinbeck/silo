name: CI

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.5'

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  safety-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Safety Regression Gate
        run: bun test packages/bot/src/__tests__/security/safety-regression.integration.test.ts

  build:
    runs-on: ubuntu-latest
    needs: [safety-regression]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Repo Hygiene
        run: bun run hygiene:check

      - name: Diff Whitespace
        run: git diff --check

      - name: Build
        run: bun run build

      - name: Type-check
        run: bun run type-check

      - name: Lint
        run: bun lint

      - name: Test
        run: bun test
