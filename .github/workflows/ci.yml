name: CI

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.5'

on:
  push:
    branches: ['main', 'release/**']
  pull_request:
    branches: ['main', 'release/**']

jobs:
  safety-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          YOUTUBE_DL_HOST: https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp

      - name: Safety Regression Gate
        run: bun test packages/bot/src/__tests__/security/safety-regression.integration.test.ts

  build:
    runs-on: ubuntu-latest
    needs: [safety-regression]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          YOUTUBE_DL_HOST: https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp

      - name: Verify radio runtime
        run: bun run radio:verify-runtime

      - name: Repo Hygiene
        run: bun run hygiene:check

      - name: Diff Whitespace
        run: git diff --check

      - name: Build
        run: bun run build

      - name: Type-check
        run: bun run type-check

      - name: Lint
        run: bun lint

      - name: Format
        run: bun run format:check

      - name: Test
        run: bun test

      - name: Validate radio encoder
        run: bun run radio:validate --offline
