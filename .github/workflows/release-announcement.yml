name: Silo release announcement
run-name: Silo release ${{ inputs.tag || github.event.release.tag_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable Silo tag to announce once
        required: true
        type: string
      commit_sha:
        description: Approved tagged commit SHA
        required: true
        type: string
      notes_sha256:
        description: Approved GitHub Release body SHA-256
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: silo-release-announcement-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  announce:
    if: github.run_attempt == 1 && ((github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (github.event_name == 'release' && github.event.release.draft == false && github.event.release.prerelease == false))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: '1.3.5'

      - name: Validate provenance and send patch notes once
        env:
          SILO_RELEASE_WEBHOOK: ${{ secrets.SILO_RELEASE_WEBHOOK }}
          SILO_RELEASE_GUILD_ID: ${{ secrets.SILO_RELEASE_GUILD_ID }}
          SILO_RELEASE_CHANNEL_ID: ${{ secrets.SILO_RELEASE_CHANNEL_ID }}
          SILO_ADDITIONAL_RELEASE_WEBHOOKS: ${{ secrets.SILO_ADDITIONAL_RELEASE_WEBHOOKS }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          EXPECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
          EXPECTED_NOTES_SHA256: ${{ inputs.notes_sha256 }}
        run: bun scripts/release-announcement.mjs
